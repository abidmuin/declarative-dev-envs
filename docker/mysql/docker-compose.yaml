services:
  db:
    image: mysql:latest
    container_name: mysql
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: "root1234"
      MYSQL_DATABASE: "localdb"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "user1234"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-puser1234"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mysql_data:
